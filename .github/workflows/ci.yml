name: CI

on:
  push:
    branches:
      - main
      - "pod*-*"
      - "feat/**"
      - "codex/**"
  pull_request:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    name: Python tests and contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate shared JSON files
        run: |
          python -m json.tool shared/brief.json > /dev/null
          python -m json.tool shared/schemas/brief.schema.json > /dev/null
          python -m json.tool shared/schemas/project_bible.schema.json > /dev/null
          python -m json.tool shared/schemas/shots.schema.json > /dev/null
          python -m json.tool shared/schemas/generation_result.schema.json > /dev/null
          python -m json.tool schemas/v1/dreampipe-job.schema.json > /dev/null

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Export integrated frontend snapshots
        run: python scripts/export_web_demo.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chrome
          npm run test:e2e

